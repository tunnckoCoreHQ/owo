[package]
name = "owo"
version = "0.1.0"
edition = "2021"
description = "owo: one world, one identity. The library for living agent identities."
license = "UNLICENSED"
publish = false

[workspace]
members = ["cli"]
default-members = [".", "cli"]

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
deunicode = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
toml = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
