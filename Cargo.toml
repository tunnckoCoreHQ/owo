[package]
name = "owo"
version = "0.1.0"
edition = "2021"
description = "owo: one world, one identity. CLI for living agent identities."
license = "UNLICENSED"
publish = false

[[bin]]
name = "owo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
deunicode = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
walkdir = "2"
