[package]
name = "owo-cli"
version = "0.1.0"
edition = "2021"
description = "owo: one world, one identity. CLI for living agent identities."
license = "UNLICENSED"
publish = false

[[bin]]
name = "owo"
path = "src/main.rs"

[dependencies]
owo-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["string"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
assert_cmd = "2"
tempfile = "3"
walkdir = "2"
